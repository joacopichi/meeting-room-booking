version: '3.9'

services:
  redis:
    image: redis:8.2
    container_name: meeting-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  web:
    build: .
    container_name: meeting-web
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      - redis
    volumes:
      - .:/app
