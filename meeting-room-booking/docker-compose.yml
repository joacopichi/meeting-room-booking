services:
  web:
    build: .
    container_name: meeting-web
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=development
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: meeting-redis
    ports:
      - "6379:6379"
