name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'release/*' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-room-booking
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias para lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Configurar reglas de Flake8
        run: |
          echo "[flake8]" > .flake8
          echo "max-line-length = 120" >> .flake8
          echo "extend-ignore = E302,E305,W292,E501" >> .flake8

      - name: Ejecutar Linter
        run: flake8 src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: meeting-room-booking
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias para tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytz

      - name: Ejecutar tests con cobertura
        run: pytest tests --cov=src --cov-report=xml --cov-report=html --junitxml=tests-report.xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Subir reporte de tests
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests-report.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: meeting-room-booking
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t meeting-room-booking .

      - name: Exportar carpeta dist
        run: |
          mkdir -p dist
          echo "Build completo: $(date)" > dist/build-info.txt

      - name: Subir carpeta dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
