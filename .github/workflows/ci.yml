name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'release/*' ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-room-booking
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias para lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Configurar reglas de Flake8
        run: |
          echo "[flake8]" > .flake8
          echo "max-line-length = 120" >> .flake8
          echo "extend-ignore = E302,E305,W292,E501" >> .flake8

      - name: Ejecutar Linter
        run: flake8 src tests

  codeql:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: meeting-room-booking
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Run CodeQL database creation and analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security-and-quality"

  test:
    runs-on: ubuntu-latest
    needs: [lint, codeql]
    defaults:
      run:
        working-directory: meeting-room-booking
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_NAME: ${{ vars.APP_NAME }}
      DB_HOST: ${{ vars.DB_HOST }}
      DEFAULT_REGION: ${{ vars.DEFAULT_REGION }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias para tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov redis pytz

      - name: Ejecutar tests con cobertura
        run: |
          pytest tests --cov=src --cov-report=xml --cov-report=html --junitxml=tests-report.xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: meeting-room-booking/htmlcov/

      - name: Subir reporte de tests
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: meeting-room-booking/tests-report.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: meeting-room-booking
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_NAME: ${{ vars.APP_NAME }}
      DB_HOST: ${{ vars.DB_HOST }}
      DEFAULT_REGION: ${{ vars.DEFAULT_REGION }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build \
            --build-arg DB_USER=${{ secrets.DB_USER }} \
            --build-arg DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --build-arg APP_NAME=${{ vars.APP_NAME }} \
            --build-arg DB_HOST=${{ vars.DB_HOST }} \
            --build-arg DEFAULT_REGION=${{ vars.DEFAULT_REGION }} \
            -t meeting-room-booking .

      - name: Exportar carpeta dist
        run: |
          mkdir -p dist
          echo "Build completo: $(date)" > dist/build-info.txt

      - name: Subir carpeta dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: meeting-room-booking/dist/
