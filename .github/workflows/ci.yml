name: CI Pipeline

on:
  push:
    branches: [ main, develop, relese ]
  pull_request:
    branches: [ main, develop, relese ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests con cobertura
        run: npm run test -- --coverage --json --outputFile=report.json

      - name: Subir reportes de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Subir reportes de tests
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.json

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Build
        run: npm run build

      - name: Subir carpeta dist como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
